name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'   # the floor stated in the README

      # Runs first: pure stdlib, no toolchain needed, fails fast.
      - name: Candidate pre-filter tests
        run: python3 tests/test_candidates_manual.py

      # Fails if README/page/card counts drift from what the pipeline reports.
      - name: Docs match the corpus
        run: python3 tests/test_docs_counts.py

      - name: Install Lean toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat lean/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build axioms and smoke tests
        run: lake build
        working-directory: lean

      - name: Formal verification tests
        run: python3 tests/test_lean_verification.py

      - name: End-to-end conflict check
        run: python3 check_conflicts.py
